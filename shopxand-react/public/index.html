<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopXand — Интернет-магазин</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Ctext x='170' y='410' font-family='Arial Black' font-weight='900' font-size='400' fill='%23111' text-anchor='middle'%3ES%3C/text%3E%3Ctext x='330' y='410' font-family='Arial Black' font-weight='900' font-size='400' fill='%231a6df0' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="root"></div>
    <div id="splash">
  <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0066ff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s;">
    <svg viewBox="0 0 500 500" width="100" height="100">
      <text x="170" y="410" font-family="Arial Black" font-weight="900" font-size="400" fill="#fff" text-anchor="middle">S</text>
      <text x="330" y="410" font-family="Arial Black" font-weight="900" font-size="400" fill="#fff" text-anchor="middle">X</text>
    </svg>
    <div style="color:#fff;font-size:24px;font-weight:800;margin-top:16px;">ShopXand</div>
    <div style="width:200px;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;margin-top:24px;overflow:hidden;">
      <div id="splashBar" style="width:0%;height:100%;background:#fff;border-radius:2px;animation:load 2s ease forwards;"></div>
    </div>
  </div>
  <style>@keyframes load{0%{width:0%}50%{width:60%}100%{width:100%}}</style>
</div>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 500);
    }, 2000);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
