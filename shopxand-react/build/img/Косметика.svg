<svg width="120" height="130" viewBox="0 0 130 130" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Иконка косметики</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Иконка с помадой и духами для магазина косметики</desc>
  <defs>
    <linearGradient id="bgCos" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#2d0a1f"/>
 <stop offset="100%" stop-color="#1a0612"/>
    </linearGradient>
    <!-- Lipstick tube -->
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#c0a060"/>
 <stop offset="40%" stop-color="#f0d080"/>
 <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <!-- Lipstick bullet -->
    <linearGradient id="lipGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#c0203a"/>
 <stop offset="40%" stop-color="#f03060"/>
 <stop offset="100%" stop-color="#900018"/>
    </linearGradient>
    <!-- Perfume bottle -->
    <linearGradient id="perfGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#e8b4d8" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#c070a0" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="perfBody" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#d090c0" stop-opacity="0.85"/>
 <stop offset="35%" stop-color="#f0c0e0" stop-opacity="0.95"/>
 <stop offset="100%" stop-color="#b060a0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#b08840"/>
 <stop offset="50%" stop-color="#e8c060"/>
 <stop offset="100%" stop-color="#906020"/>
    </linearGradient>
    <linearGradient id="shineL" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#bgCos)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Soft glow -->
  <ellipse cx="60" cy="65" rx="45" ry="40" fill="#ff4080" fill-opacity="0.07" style="fill:rgb(255, 64, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === PERFUME BOTTLE === -->
  <!-- Bottle neck -->
  <rect x="55" y="30" width="14" height="8" rx="3" fill="url(#capGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Cap -->
  <rect x="53" y="22" width="18" height="10" rx="4" fill="url(#capGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Cap shine -->
  <rect x="55" y="23" width="6" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.4" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Spray nozzle -->
  <rect x="67" y="25" width="10" height="3" rx="1.5" fill="url(#capGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottle body -->
  <rect x="46" y="38" width="32" height="52" rx="10" fill="url(#perfBody)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottle shine -->
  <rect x="50" y="42" width="8" height="30" rx="4" fill="url(#shineL)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottle border -->
  <rect x="46" y="38" width="32" height="52" rx="10" fill="none" stroke="#e0a0c0" stroke-width="0.8" stroke-opacity="0.5" style="fill:none;stroke:rgb(224, 160, 192);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Label line -->
  <rect x="51" y="58" width="22" height="14" rx="3" fill="#ffffff" fill-opacity="0.18" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Liquid inside -->
  <rect x="48" y="72" width="28" height="16" rx="0" fill="#d070a0" fill-opacity="0.3" style="fill:rgb(208, 112, 160);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="46" y="82" width="32" height="8" rx="0" fill="#c060a0" fill-opacity="0.2" clip-path="inset(0 0 0 0 round 0 0 10px 10px)" style="fill:rgb(192, 96, 160);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === LIPSTICK === -->
  <!-- Tube base -->
  <rect x="86" y="68" width="14" height="30" rx="4" fill="url(#tubeGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Tube shine -->
  <rect x="88" y="70" width="4" height="20" rx="2" fill="#ffffff" fill-opacity="0.3" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bullet holder -->
  <rect x="86" y="60" width="14" height="12" rx="3" fill="#c8a050" style="fill:rgb(200, 160, 80);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Lipstick bullet -->
  <rect x="88" y="42" width="10" height="22" rx="3" fill="url(#lipGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bullet tip -->
  <path d="M88 44 Q93 36 98 44" fill="url(#lipGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bullet shine -->
  <rect x="89.5" y="44" width="3" height="14" rx="1.5" fill="#ffffff" fill-opacity="0.25" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Sparkles -->
  <circle cx="18" cy="22" r="2.5" fill="#ffaacc" fill-opacity="0.8" style="fill:rgb(255, 170, 204);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="26" cy="16" r="1.5" fill="#ffaacc" fill-opacity="0.5" style="fill:rgb(255, 170, 204);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="18" y1="16" x2="18" y2="28" stroke="#ffaacc" stroke-width="1" stroke-opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(255, 170, 204);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="12" y1="22" x2="24" y2="22" stroke="#ffaacc" stroke-width="1" stroke-opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(255, 170, 204);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <circle cx="102" cy="100" r="2" fill="#ffcc88" fill-opacity="0.7" style="fill:rgb(255, 204, 136);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="102" y1="95" x2="102" y2="105" stroke="#ffcc88" stroke-width="1" stroke-opacity="0.4" style="fill:rgb(0, 0, 0);stroke:rgb(255, 204, 136);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="97" y1="100" x2="107" y2="100" stroke="#ffcc88" stroke-width="1" stroke-opacity="0.4" style="fill:rgb(0, 0, 0);stroke:rgb(255, 204, 136);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Small dots decoration -->
  <circle cx="20" cy="95" r="2" fill="#ff80b0" fill-opacity="0.5" style="fill:rgb(255, 128, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="28" cy="104" r="1.5" fill="#ff80b0" fill-opacity="0.4" style="fill:rgb(255, 128, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="14" cy="104" r="1" fill="#ff80b0" fill-opacity="0.3" style="fill:rgb(255, 128, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>