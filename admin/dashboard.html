<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopXand Admin — Панель</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-sidebar">
   <div class="admin-sidebar__logo">ShopXand Admin</div>
   <nav class="admin-sidebar__nav">
  <a href="dashboard.html" class="active">📊 Панель</a>
  <a href="orders.html">📦 Заказы</a>
  <a href="products.html">🛍️ Товары</a>
  <a href="analytics.html">📈 Аналитика</a>
   </nav>
    </div>
    <div class="admin-main">
   <div class="admin-header">
  <h1>📊 Панель управления</h1>
  <button onclick="logoutAdmin()">Выйти</button>
   </div>
   <div class="admin-cards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px;">
  <div class="admin-card" style="background:#fff;padding:24px;border-radius:12px;text-align:center;">
 <h3 id="totalOrders">0</h3>
 <p>Всего заказов</p>
  </div>
  <div class="admin-card" style="background:#fff;padding:24px;border-radius:12px;text-align:center;">
 <h3 id="pendingOrders">0</h3>
 <p>В обработке</p>
  </div>
  <div class="admin-card" style="background:#fff;padding:24px;border-radius:12px;text-align:center;">
 <h3 id="completedOrders">0</h3>
 <p>Выполнено</p>
  </div>
   </div>
    </div>
    <script src="js/admin.js"></script>
    <script>checkAdmin();</script>
</body>
</html>
