<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopXand Admin — Вход</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login">
    <div class="admin-login__container">
        <div class="admin-login__logo">ShopXand Admin</div>
        <h2>Вход в панель управления</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="adminUser" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="adminPass" placeholder="••••••" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        <p id="adminError" style="color:red;display:none;">Неверный логин или пароль</p>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
