<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopXand Admin — Товары</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-sidebar">
        <div class="admin-sidebar__logo">ShopXand Admin</div>
        <nav class="admin-sidebar__nav">
            <a href="dashboard.html">📊 Панель</a>
            <a href="orders.html">📦 Заказы</a>
            <a href="products.html" class="active">🛍️ Товары</a>
            <a href="analytics.html">📈 Аналитика</a>
        </nav>
    </div>
    <div class="admin-main">
        <div class="admin-header">
            <h1>🛍️ Управление товарами</h1>
            <button onclick="logoutAdmin()">Выйти</button>
        </div>
        
        <!-- Форма добавления товара -->
        <div style="background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;">
            <h3 id="formTitle">Добавить товар</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="prodName" placeholder="Название товара">
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="prodCat">
                        <option value="Одежда">Одежда</option>
                        <option value="Электроника">Электроника</option>
                        <option value="Дом и сад">Дом и сад</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Цена (сомони)</label>
                    <input type="number" id="prodPrice" placeholder="120">
                </div>
                <div class="form-group">
                    <label>Старая цена</label>
                    <input type="number" id="prodOldPrice" placeholder="180">
                </div>
                <div class="form-group">
                    <label>Картинка (путь)</label>
                    <input type="text" id="prodImg" placeholder="/img/товар.jpeg">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <input type="text" id="prodDesc" placeholder="Краткое описание">
                </div>
            </div>
            <button onclick="saveProduct()" style="margin-top:12px;padding:12px 24px;background:#0066ff;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;">Сохранить товар</button>
        </div>
        
        <!-- Список товаров -->
        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Категория</th>
                    <th>Цена</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                <tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
    <script src="js/admin.js"></script>
    <script>
        checkAdmin();
        loadProductsAdmin();
    </script>
</body>
</html>
