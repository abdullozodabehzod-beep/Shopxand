<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopXand Admin — Товары</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-sidebar">
   <div class="admin-sidebar__logo">ShopXand Admin</div>
   <nav class="admin-sidebar__nav">
  <a href="dashboard.html">📊 Панель</a>
  <a href="orders.html">📦 Заказы</a>
  <a href="products.html" class="active">🛍️ Товары</a>
  <a href="analytics.html">📈 Аналитика</a>
   </nav>
    </div>
    <div class="admin-main">
   <div class="admin-header">
  <h1>🛍️ Управление товарами</h1>
  <button onclick="logoutAdmin()">Выйти</button>
   </div>
   
    <!-- Форма добавления товара -->
<div style="background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;">
    <h3>Добавить товар</h3>
    
    <div class="form-group"><label>Название</label><input type="text" id="prodName" placeholder="Название"></div>
    <div class="form-group"><label>Категория</label>
        <select id="prodCat">
            <option>Одежда</option><option>Электроника</option><option>Дом и сад</option><option>Компьютеры</option><option>Косметика</option><option>Аксессуары</option>
        </select>
    </div>
    <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;"><label>Цена (с.)</label><input type="number" id="prodPrice" placeholder="120"></div>
        <div class="form-group" style="flex:1;"><label>Старая цена</label><input type="number" id="prodOldPrice" placeholder="180"></div>
    </div>
    <div class="form-group"><label>Картинка</label><input type="text" id="prodImg" placeholder="/img/товар.jpeg"></div>
    <div class="form-group"><label>Описание</label><input type="text" id="prodDesc" placeholder="Описание"></div>
    
    <div class="form-group"><label>Материал</label><input type="text" id="prodMaterial" placeholder="Хлопок, Кожа..."></div>
    <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;"><label>Сезон</label>
            <select id="prodSeason"><option>Все сезоны</option><option>Весна</option><option>Лето</option><option>Осень</option><option>Зима</option></select>
        </div>
        <div class="form-group" style="flex:1;"><label>Стиль</label><input type="text" id="prodStyle" placeholder="Повседневный..."></div>
    </div>
    
    <div class="form-group"><label>Размеры (через запятую)</label><input type="text" id="prodSizes" placeholder="X, XL, 2XL, 3XL"></div>
    <div class="form-group"><label>Размеры обуви (через запятую)</label><input type="text" id="prodShoeSizes" placeholder="38, 39, 40, 41"></div>
    
    <div class="form-group"><label>Цвета (через запятую)</label><input type="text" id="prodColors" placeholder="Красный, Синий"></div>
    <div class="form-group"><label>Доп. картинки (через запятую)</label><input type="text" id="prodThumbs" placeholder="/img/красный.jpeg, /img/синий.jpeg"></div>
    <div class="form-group"><label>Цены доп. картинок (через запятую)</label><input type="text" id="prodThumbPrices" placeholder="120, 130"></div>
    
    <button onclick="saveProduct()" style="width:100%;padding:14px;background:#0066ff;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:700;">Сохранить товар</button>
</div>
   
   <!-- Список товаров -->
   <table class="admin-table">
  <thead>
 <tr>
<th>ID</th>
<th>Название</th>
<th>Категория</th>
<th>Цена</th>
<th>Действия</th>
 </tr>
  </thead>
  <tbody id="productsTable">
 <tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr>
  </tbody>
   </table>
    </div>
    <script src="js/admin.js"></script>
    <script>
   checkAdmin();
   loadProductsAdmin();
    </script>
</body>
</html>
